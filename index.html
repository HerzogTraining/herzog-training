let archivOpen={};
function toggleArchiv(name){archivOpen[name]=!archivOpen[name];rVorlagen();}
function buildArchivList(sourceName){
  const items=(S.archivSaisons||[]).filter(a=>a.sourceName===sourceName).sort((a,b)=>new Date(b.archivedAt)-new Date(a.archivedAt));
  if(!items.length)return '';
  const open=!!archivOpen[sourceName];
  const rows=items.map(a=>{
    const phRows=(a.phasen&&a.phasen.length)?[...a.phasen].sort((x,y)=>x.vonW-y.vonW).map(p=>{
      const pi=pd(p.phase,p.int);
      return `<div class="pitem" style="margin-bottom:4px;">
        <div class="pdot" style="background:${pi.f};border:1px solid ${pi.t}30;"></div>
        <span class="ptxt">Woche ${p.vonW+1}\u2013${p.bisW+1} \u00b7 ${p.phase} \u00b7 ${p.int}%</span>
      </div>`;
    }).join(''):`<div class="vorlage-empty">Keine Phasen.</div>`;
    const wkRows=(a.wettkaempfe&&a.wettkaempfe.length)?[...a.wettkaempfe].sort((x,y)=>x.yr*100+x.kw-(y.yr*100+y.kw)).map(w=>{
      const pc=wkPriColor(w.prio||'C');
      return `<div class="pitem" style="margin-bottom:4px;">
        <div style="width:18px;height:18px;background:${pc.bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:${pc.c};flex-shrink:0;">${w.prio||'C'}</div>
        <span class="ptxt">${w.name}${w.ort?' \u00b7 '+w.ort:''} \u00b7 ${w.dat||'KW '+w.kw+'/'+w.yr}</span>
      </div>`;
    }).join(''):`<div class="vorlage-empty">Keine Wettk\u00e4mpfe.</div>`;
    return `<div style="border:1px solid var(--border2);border-radius:8px;padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-weight:600;font-size:13px;">${a.label}</span>
        <button class="pdel" onclick="delArchivSaison(${a.id})">\u00d7</button>
      </div>
      <div style="font-size:10px;color:var(--hint);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;">Phasen</div>
      ${phRows}
      <div style="font-size:10px;color:var(--hint);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin:6px 0 4px;">Wettk\u00e4mpfe</div>
      ${wkRows}
    </div>`;
  }).join('');
  const safeName=sourceName.replace(/'/g,"\\'");
  return `<div style="margin-top:10px;">
    <div onclick="toggleArchiv('${safeName}')" style="cursor:pointer;font-size:10px;color:var(--hint);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">\ud83d\udce6 Archiv (${items.length}) ${open?'\u25b2':'\u25bc'}</div>
    ${open?rows:''}
  </div>`;
}
function showArchiveSaison(vid){
  const v=S.vorlagen.find(x=>x.id===vid);
  if(!v)return;
  const wkCount=(v.wettkaempfe||[]).length;
  const phCount=(v.phasen||[]).length;
  const yr=new Date().getFullYear();
  modal(`<h3>${v.name} \u2013 Saison archivieren</h3>
    <div class="info-banner" style="font-size:12px;">Sichert die aktuellen ${phCount} Phasen und ${wkCount} Wettk\u00e4mpfe als Archiv-Schnappschuss zum Nachschauen. Die Vorlage selbst bleibt danach unver\u00e4ndert \u2013 du kannst direkt darauf aufbauen und einzelne Eintr\u00e4ge anpassen, l\u00f6schen oder erg\u00e4nzen.</div>
    <div class="frow"><label>Bezeichnung</label><input type="text" id="m-asl" value="Saison ${yr}"></div>
    <button class="mbtn" onclick="confArchiveSaison(${vid})">Archivieren</button>`);
}
function confArchiveSaison(vid){
  const v=S.vorlagen.find(x=>x.id===vid);
  if(!v)return;
  const label=document.getElementById('m-asl').value.trim()||('Saison '+new Date().getFullYear());
  if(!S.archivSaisons)S.archivSaisons=[];
  if(!S.nxtArchivId)S.nxtArchivId=1;
  S.archivSaisons.push({
    id:S.nxtArchivId++,
    sourceName:v.name,
    label,
    phasen:JSON.parse(JSON.stringify(v.phasen||[])),
    wettkaempfe:JSON.parse(JSON.stringify(v.wettkaempfe||[])),
    archivedAt:new Date().toISOString()
  });
  save();
  closeM();
  rVorlagen();
}
function delArchivSaison(id){
  if(!confirm('Archiv-Eintrag endg\u00fcltig l\u00f6schen?'))return;
  S.archivSaisons=(S.archivSaisons||[]).filter(a=>a.id!==id);
  save();

  if(!v||!a)return;
  const seq=buildSeq(a.startKW,a.startYr);
  // convert absolute KW to week offset
  v.phasen=a.plan.map(p=>{
    const vonAbs=toAbs(p.von.kw,p.von.yr);
    const bisAbs=toAbs(p.bis.kw,p.bis.yr);
    const vonW=seq.findIndex(s=>toAbs(s.kw,s.yr)===vonAbs);
    const bisW=seq.findIndex(s=>toAbs(s.kw,s.yr)===bisAbs);
    return{vonW:vonW>=0?vonW:0,bisW:bisW>=0?bisW:51,phase:p.phase,int:p.int};
  });
  save();closeM();alert('Vorlage "'+v.name+'" wurde gespeichert.');rVorlagen();
}

function buildHist(a){

  for(let i=0;i<12;i++){
    kw--;if(kw<1){yr--;kw=weeksInYear(yr);}
    const key=kwKeyStr(kw,yr);
    const w=wochen[key];
    if(w&&(w.zustand||(w.einheiten&&Object.values(w.einheiten).some(v=>v)))){
      weeks.push({kw,yr,key,w});
    }
  }
  if(!weeks.length)return '';
  const zIcon={gut:'🟢',ok:'🟡',muede:'🔴'};
  const rows=weeks.map(({kw,yr,w})=>{
    const link=w.einheiten&&w.einheiten[1]?`<a href="${w.einheiten[1]}" target="_blank" class="hist-link">T</a>`:'';
    return `<div class="hist-row" style="flex-direction:column;align-items:flex-start;gap:3px;">
      <div style="display:flex;align-items:center;gap:6px;width:100%;">
        <span class="hist-kw">KW ${kw} / ${yr}</span>
        <span class="hist-z">${zIcon[w.zustand]||'·'}</span>

  }).join('');
  return `<div class="slabel" style="margin-top:16px;">Rückblick</div>${rows}`;
}

(function(){
  let _acDrop=null,_acTgt=null,_acIdx=-1;
  function allNames(){
    const k=getKatalog();const r=[];
    Object.values(k).forEach(a=>a.forEach(n=>r.push(n)));
    return r;
  }
  function curWord(ta){
    const v=ta.value,pos=ta.selectionStart;
    let s=pos;
    while(s>0&&!/[\s]/.test(v[s-1]))s--;
    return{word:v.slice(s,pos),start:s,end:pos};
  }
  function hl(name,q){
    const i=name.toLowerCase().indexOf(q.toLowerCase());
    if(i<0)return name;
    return name.slice(0,i)+'<strong>'+name.slice(i,i+q.length)+'</strong>'+name.slice(i+q.length);
  }
  function hide(){if(_acDrop){_acDrop.remove();_acDrop=null;}_acTgt=null;_acIdx=-1;}
  function apply(ta,item,wi){
    ta.value=ta.value.slice(0,wi.start)+item+ta.value.slice(wi.end);
    const p=wi.start+item.length;ta.setSelectionRange(p,p);
    ta.dispatchEvent(new Event('input',{bubbles:true}));
    hide();ta.focus();
  }
  function show(ta,matches,wi){
    hide();if(!matches.length)return;
    _acTgt=ta;_acIdx=-1;
    const rect=ta.getBoundingClientRect();
    const div=document.createElement('div');
    div.className='ac-dropdown';
    div.style.top=(rect.bottom+4)+'px';
    div.style.left=(rect.left+8)+'px';
    matches.forEach(m=>{
      const el=document.createElement('div');
      el.className='ac-item';
      el.innerHTML=hl(m,wi.word);
      el.addEventListener('mousedown',e=>{e.preventDefault();apply(ta,m,wi);});
      div.appendChild(el);
    });
    document.body.appendChild(div);
    _acDrop=div;
  }
  function isPlanTA(el){return el.tagName==='TEXTAREA'&&(/^plan[23]?-/.test(el.id)||/^pt[12]-/.test(el.id));}
  document.addEventListener('input',e=>{
    if(!isPlanTA(e.target))return;
    const wi=curWord(e.target);
    if(wi.word.length<2){hide();return;}
    const q=wi.word.toLowerCase();
    const matches=allNames()
      .filter(n=>n.toLowerCase().includes(q))
      .sort((a,b)=>{
        // startsWith match comes first, then by length (shorter = simpler name)
        const as=a.toLowerCase().startsWith(q)?0:1;
        const bs=b.toLowerCase().startsWith(q)?0:1;
        if(as!==bs)return as-bs;
        return a.length-b.length;
      })
      .slice(0,8);
    if(matches.length)show(e.target,matches,wi);else hide();
  });
  document.addEventListener('keydown',e=>{
    if(!_acDrop||!isPlanTA(e.target))return;
    const items=_acDrop.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();_acIdx=Math.min(_acIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('ac-active',i===_acIdx));}
    else if(e.key==='ArrowUp'){e.preventDefault();_acIdx=Math.max(_acIdx-1,0);items.forEach((el,i)=>el.classList.toggle('ac-active',i===_acIdx));}
    else if(e.key==='Enter'||e.key==='Tab'){if(_acIdx>=0&&items[_acIdx]){e.preventDefault();items[_acIdx].dispatchEvent(new MouseEvent('mousedown'));}else hide();}
    else if(e.key==='Escape')hide();
  });
  document.addEventListener('blur',e=>{if(isPlanTA(e.target))setTimeout(hide,150);},true);
  document.addEventListener('scroll',hide,true);
})();

function gcalGetToken(){
  try{
    const t=sessionStorage.getItem('gcal_token');
    const e=parseInt(sessionStorage.getItem('gcal_expiry')||'0');
    if(t&&e>Date.now()+30000)return t;
  }catch(e){}
  return null;
}
function gcalSetToken(token,expiresIn){
  try{
    sessionStorage.setItem('gcal_token',token);
    sessionStorage.setItem('gcal_expiry',String(Date.now()+(expiresIn-30)*1000));
  }catch(e){}
}
function gcalIsConnected(){return!!gcalGetToken();}

function gcalConnect(){
  const state=Math.random().toString(36).slice(2);
  sessionStorage.setItem('gcal_state',state);
  const params=new URLSearchParams({
    client_id:GCAL_CLIENT_ID,
    redirect_uri:GCAL_REDIRECT,
    response_type:'token',
    scope:GCAL_SCOPE,
    state,
    include_granted_scopes:'true'
  });
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params;
}

function gcalHandleRedirect(){
  const hash=location.hash.slice(1);
  if(!hash.includes('access_token'))return;
  const params=new URLSearchParams(hash);
  const token=params.get('access_token');
  const expiresIn=parseInt(params.get('expires_in')||'3600');
  const state=params.get('state');
  if(token&&state===sessionStorage.getItem('gcal_state')){
    gcalSetToken(token,expiresIn);
    history.replaceState(null,'',location.pathname);
    gcalUpdateUI();
  }
}

        if(!found)return{start:startDate,end:endDate};
        const von=found.vonDat?parseDate(found.vonDat):(found.vonKW?kwToDate(found.vonKW,found.vonYr):null);
        const bisRaw=found.bisDat?parseDate(found.bisDat):(found.bisKW?new Date(kwToDate(found.bisKW,found.bisYr).getTime()+6*86400000):null);
        if(!von||!bisRaw)return{start:startDate,end:endDate};
        const evStart=von>mon?von:mon;
        const evEnd=bisRaw<sun?bisRaw:sun;
        const evEndNext=new Date(evEnd.getTime()+86400000);
        return{start:gcalFmtDate(evStart),end:gcalFmtDate(evEndNext)};
      };
      const parts=[];
      if(notiz)parts.push(notiz.split('\n')[0]);
      if(!isUrlaub&&!isTl&&!isMil){
        if(!parts.length)continue;
        const summary=a.name.split(' ')[0]+' '+a.name.split(' ')[1][0]+'. KW'+kw+': '+parts.join(', ');
        const stableId='ht-'+a.id+'-'+startDate.replace(/-/g,'')+'@herzogtraining';
        await gcalUpsertEvent(token,stableId,summary,startDate,endDate);
        synced++;
      } else {
        if(notiz){
          const summary=a.name.split(' ')[0]+' '+a.name.split(' ')[1][0]+'. KW'+kw+': '+parts.join(', ');
          const stableId='ht-'+a.id+'-'+startDate.replace(/-/g,'')+'@herzogtraining';
          await gcalUpsertEvent(token,stableId,summary,startDate,endDate);
          synced++;
        }
        if(isUrlaub){
          const{start:uStart,end:uEnd}=perDaysRange(a.urlaub);
          const uSummary=a.name.split(' ')[0]+' '+a.name.split(' ')[1][0]+'. 🏖 Urlaub';
          const uId='ht-urlaub-'+a.id+'-kw'+kw+'-'+yr+'@herzogtraining';
          await gcalUpsertEvent(token,uId,uSummary,uStart,uEnd);
          synced++;
        }
        if(isTl){
          const{start:tStart,end:tEnd}=perDaysRange(a.tl);
          const tSummary=a.name.split(' ')[0]+' '+a.name.split(' ')[1][0]+'. 🏋️ TL';
          const tId='ht-tl-'+a.id+'-kw'+kw+'-'+yr+'@herzogtraining';
          await gcalUpsertEvent(token,tId,tSummary,tStart,tEnd);
          synced++;
        }
        if(isMil){
          const{start:mStart,end:mEnd}=perDaysRange(a.mil);
          const mSummary=a.name.split(' ')[0]+' '+a.name.split(' ')[1][0]+'. 🪖 Militär-WK';
          const mId='ht-mil-'+a.id+'-kw'+kw+'-'+yr+'@herzogtraining';
          await gcalUpsertEvent(token,mId,mSummary,mStart,mEnd);
          synced++;
        }
      }
    }
  }
  // PT-Kunden Ferien
  for(const k of (S.personal||[])){
    if(!k.urlaub||!k.urlaub.length)continue;
    const firstName=k.name.split(' ')[0];
    const lastName=k.name.split(' ')[1]||'';
    const nameShort=lastName?firstName+' '+lastName[0]+'.':firstName;
    for(let i=0;i<k.urlaub.length;i++){
      const u=k.urlaub[i];
      if(!u.vonDat||!u.bisDat)continue;
      const vonD=parseDate(u.vonDat);
      const bisD=parseDate(u.bisDat);
      if(!vonD||!bisD)continue;
      const startDate=gcalFmtDate(vonD);
      const bisNext=new Date(bisD);bisNext.setDate(bisNext.getDate()+1);
      const endDate=gcalFmtDate(bisNext);
      const summary='🏖 '+nameShort+' PT-Ferien';
      const stableId='ht-pt-'+k.id+'-ferien-'+i;
      await gcalUpsertEvent(token,stableId,summary,startDate,endDate);
      synced++;
    }
  }
  gcalShowStatus(synced>0?'✓ Kalender aktualisiert':'Keine Notizen');
}

async function gcalUpsertEvent(token,stableId,summary,startDate,endDate){
  const h={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  const calId=encodeURIComponent(GCAL_CALENDAR_ID);
  try{
    const res=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+calId+'/events?timeMin='+startDate+'T00:00:00Z&timeMax='+endDate+'T23:59:59Z&singleEvents=true&maxResults=250',{headers:h});
    const data=await res.json();
    const ex=data.items&&data.items.find(e=>e.description&&e.description===stableId);
    const body=JSON.stringify({summary,description:stableId,start:{date:startDate},end:{date:endDate}});
    if(ex){
      await fetch('https://www.googleapis.com/calendar/v3/calendars/'+calId+'/events/'+ex.id,{method:'PUT',headers:h,body});
    }else{
      await fetch('https://www.googleapis.com/calendar/v3/calendars/'+calId+'/events',{method:'POST',headers:h,body});
    }
  }catch(e){console.error('gcal',e);}
}

function saveEditPhase(id){
  const a=S.athleten.find(x=>x.id===id);
  if(!a)return;
  const vonKw=parseInt(document.getElementById('ep-vonkw').value);
  const vonYr=parseInt(document.getElementById('ep-vonyr').value);
  const bisKw=parseInt(document.getElementById('ep-biskw').value);
  const bisYr=parseInt(document.getElementById('ep-bisyr').value);
  if(!vonKw||!vonYr||!bisKw||!bisYr){alert('Bitte Von/Bis ausfüllen.');return;}
  if(toAbs(vonKw,vonYr)>toAbs(bisKw,bisYr)){alert('Von muss vor Bis liegen.');return;}
  const entry={
    phase:document.getElementById('ep-phase').value,
    int:parseInt(document.getElementById('ep-int').value)||0,
    von:{kw:vonKw,yr:vonYr},
    bis:{kw:bisKw,yr:bisYr}
  };
  const sw=document.getElementById('ep-sw').value.trim();
  if(sw)entry.schwerpunkte=sw;
  console.log('BEFORE filter, plan:', JSON.stringify(a.plan));
  console.log('NEW entry:', JSON.stringify(entry));
  a.plan=a.plan.filter(p=>!(toAbs(p.von.kw,p.von.yr)>=toAbs(entry.von.kw,entry.von.yr)&&toAbs(p.bis.kw,p.bis.yr)<=toAbs(entry.bis.kw,entry.bis.yr)));
  // Überlappende Einträge kürzen
  a.plan.forEach(p=>{
    const pVon=toAbs(p.von.kw,p.von.yr), pBis=toAbs(p.bis.kw,p.bis.yr);
    const eVon=toAbs(entry.von.kw,entry.von.yr), eBis=toAbs(entry.bis.kw,entry.bis.yr);
    if(pVon<eVon&&pBis>=eVon&&pBis<=eBis){
      // Phase endet innerhalb des neuen Eintrags -> Bis kürzen
      const newBisAbs=eVon-1;
      const newBisDate=absToKwYr(newBisAbs);
      p.bis={kw:newBisDate.kw,yr:newBisDate.yr};
    } else if(pVon>=eVon&&pVon<=eBis&&pBis>eBis){
      // Phase beginnt innerhalb des neuen Eintrags -> Von kürzen
      const newVonAbs=eBis+1;
      const newVonDate=absToKwYr(newVonAbs);
      p.von={kw:newVonDate.kw,yr:newVonDate.yr};
    } else if(pVon<eVon&&pBis>eBis){
      // Phase umschliesst neuen Eintrag -> aufteilen
      const newBisAbs=eVon-1;
      const newBisDate=absToKwYr(newBisAbs);
      const newVonAbs=eBis+1;
      const newVonDate=absToKwYr(newVonAbs);
      const tail={...p,von:{kw:newVonDate.kw,yr:newVonDate.yr}};
      p.bis={kw:newBisDate.kw,yr:newBisDate.yr};
      a.plan.push(tail);
    }
  });
  a.plan=a.plan.filter(p=>toAbs(p.von.kw,p.von.yr)<=toAbs(p.bis.kw,p.bis.yr));
  a.plan.push(entry);
  closeM();
  saveState().then(()=>{
    rUebersicht();
  });
}

function startVoiceInput(aid, planField){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Spracherkennung nicht verfügbar in diesem Browser.');return;}
  const ta=document.getElementById(planField+'-'+aid);
  if(!ta)return;
  const btn=event.target;
  const origText=btn.textContent;
  btn.textContent='🔴';
  btn.disabled=true;
  const recognition=new SR();
  recognition.lang='de-CH';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  recognition.onresult=async(e)=>{
    const transcript=e.results[0][0].transcript;
    btn.textContent='⏳';
    await voiceToTraining(aid,planField,transcript,btn,origText);
  };
  recognition.onerror=(e)=>{
    btn.textContent=origText;
    btn.disabled=false;
    alert('Spracherkennung fehlgeschlagen: '+e.error);
  };
  recognition.onend=()=>{
    if(btn.textContent==='🔴'){
      btn.textContent=origText;
      btn.disabled=false;
    }
  };
  recognition.start();
}

async function voiceToTraining(aid,planField,transcript,btn,origText){
  // Build katalog list for context
  const k=getKatalog();
  let katalogList='';
  Object.keys(k).forEach(cat=>{
    if(k[cat]&&k[cat].length){
      katalogList+=cat+':\n';
      k[cat].forEach(u=>katalogList+='  - '+u+'\n');
    }
  });
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:500,
        messages:[{
          role:'user',
          content:`Du bist Assistent für einen Schweizer Athletik-Trainer. Der Trainer hat folgendes gesagt (Schweizerdeutsch möglich): "${transcript}"

Hier ist sein Übungskatalog:
${katalogList}

Extrahiere die Übungen und matche sie so gut wie möglich auf den Katalog. Gib NUR den formatierten Trainingstext zurück, kein JSON, keine Erklärung. Format: eine Übung pro Zeile, z.B.:
Kniebeugen 4x6 80%
Kreuzheben 3x4 90%
Schulterdrücken 3x8

Nutze exakt die Namen aus dem Katalog wenn möglich. Nur die Übungsliste, sonst nichts.`
        }]
      })
    });
    const data=await resp.json();
    const result=(data.content&&data.content[0]&&data.content[0].text)||'';
    const ta=document.getElementById(planField+'-'+aid);
    if(ta){
      const existing=ta.value.trim();
      ta.value=existing?(existing+'\n'+result.trim()):result.trim();
      autoResize(ta);
    }
  }catch(e){
    alert('Fehler bei der KI-Verarbeitung: '+e.message);
  }finally{
    btn.textContent=origText;
    btn.disabled=false;
  }
}

function rIdeen(){

  SPORTARTEN.forEach(sport=>{
    const entries=(S.ideen[sport]||[]).slice().sort((a,b)=>b.ts-a.ts);
    h+=`<div style="margin-bottom:24px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;">

        h+=`<div style="padding:10px 0;border-bottom:1px solid var(--border);">

            <div style="flex:1;">
              <div style="font-size:13px;line-height:1.5;white-space:pre-wrap;">${(e.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>

function addIdee(sport){

function saveIdee(sport){

  if(!S.ideen[sport])S.ideen[sport]=[];

  save();
  rIdeen();
}
function editIdee(sport,ts){

function saveEditIdee(sport,ts){

function delIdee(sport,ts){

function toggleActivePin(id){

    }
  });

function showCopyToSport(aid){
  const a=S.athleten.find(x=>x.id===aid);
  if(!a)return;
  saveN(aid);
  const vkw=S.viewKW||KWN,vyr=S.viewYR||YRN;

  const rows=targets.map(t=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:13px;"><input type="checkbox" class="cpy-chk" value="${t.id}" checked> ${t.name}</label>`).join('');

    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:10px;">Welche Trainings?</div>

    <div style="max-height:220px;overflow-y:auto;margin:4px 0 10px;">${rows}</div>
    <button class="mbtn" onclick="confCopyToSport(${aid})">Auf ausgewählte kopieren</button>`);
}
function confCopyToSport(aid){
  const a=S.athleten.find(x=>x.id===aid);
  if(!a)return;
  const key=kwKeyStr(S.viewKW||KWN,S.viewYR||YRN);
  const src=(a.wochen&&a.wochen[key])||{};
  const ids=[...document.querySelectorAll('.cpy-chk:checked')].map(x=>parseInt(x.value));
  const fields=[...document.querySelectorAll('.cpy-plan:checked')].map(x=>x.value);
  if(!fields.length){alert('Bitte mindestens ein Training auswählen.');return;}
  if(!ids.length){alert('Bitte mindestens einen Athleten auswählen.');return;}
  ids.forEach(tid=>{
    const t=S.athleten.find(x=>x.id===tid);
    if(!t)return;
    if(!t.wochen)t.wochen={};
    if(!t.wochen[key])t.wochen[key]={zustand:null,einheiten:{},notiz:'',plan:''};
    fields.forEach(f=>{t.wochen[key][f]=src[f]||'';});
  });
  save();
  closeM();
  rUebersicht();
}
function saveN(id){
  const a=S.athleten.find(x=>x.id===id);
  if(a){
    if(!a.wochen)a.wochen={};
    const key=kwKeyStr(S.viewKW||KWN,S.viewYR||YRN);
    if(!a.wochen[key])a.wochen[key]={zustand:null,einheiten:{},notiz:'',plan:''};
    const inp=document.getElementById('ein-'+id+'-1');
    if(inp)a.wochen[key].einheiten[1]=inp.value.trim();
    const ta=document.getElementById('notiz-'+id);
    if(ta)a.wochen[key].notiz=ta.value;
    const planTa=document.getElementById('plan-'+id);
    if(planTa)a.wochen[key].plan=planTa.value;
    const plan2Ta=document.getElementById('plan2-'+id);
    if(plan2Ta)a.wochen[key].plan2=plan2Ta.value;
    const plan3Ta=document.getElementById('plan3-'+id);
    if(plan3Ta)a.wochen[key].plan3=plan3Ta.value;
    const bt=document.getElementById('beachten-'+id);
    if(bt)a.letzteNotiz=bt.value.trim()||null;
  }
  save();
  const sv=document.getElementById('sv-'+id);
  if(sv){sv.style.display='block';setTimeout(()=>{sv.style.display='none';},2000);}
  // Do NOT call rUebersicht() here — it would re-render and lose cursor position
}
const _saveNTimers={};
function autoSaveN(id){

}
function autoSaveBeachten(id){
  const a=S.athleten.find(x=>x.id===id);

  if(a&&bt)a.letzteNotiz=bt.value.trim()||null;

  window._bTimer=setTimeout(()=>save(),1500);
}
function switchTab(t,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');

  else if(t==='uebersicht')rUebersicht();
  else if(t==='editor')rEditor();
  else if(t==='vorlagen')rVorlagen();

  else if(t==='extern')rExtern();
}

  S.athleten.forEach(a=>{

<script>
/* YouTube-Videos in der App abspielen (statt neuen Tab). Senden/Teilen bleibt unverändert. */
(function(){
  function ytId(url){
    if(!url)return null;
    var m=String(url).match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);

  function closeVid(){

    x.type='button';x.textContent='✕';x.title='Schliessen';
    x.style.cssText='background:#E8000F;color:#fff;border:none;border-radius:6px;width:30px;height:28px;font-size:15px;cursor:pointer;';
    x.onclick=closeVid;
    bar.appendChild(t);bar.appendChild(yt);bar.appendChild(x);
    var wrap=document.createElement('div');
    wrap.style.cssText='position:relative;width:100%;padding-top:56.25%;background:#000;';
    var f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1';
    f.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');

    f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');

    wrap.appendChild(f);
    box.appendChild(bar);box.appendChild(wrap);
    o.appendChild(box);
    o.addEventListener('click',function(e){if(e.target===o)closeVid();});
    document.body.appendChild(o);
    document.addEventListener('keydown',escVid);
  }

})();

<script>
/* Wochenplan als PDF senden (Auswahl Training 1/2/3, inkl. 1RM-Werte) */
(function(){
  var JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  var loading=null;
  function loadJsPdf(){
    if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve();
    if(loading)return loading;
    loading=new Promise(function(res,rej){
      var s=document.createElement('script');s.src=JSPDF_URL;s.onload=function(){res();};
      s.onerror=function(){loading=null;rej(new Error('jsPDF konnte nicht geladen werden'));};
      document.head.appendChild(s);
    });
    return loading;
  }
  function clean(t){
    return String(t==null?'':t)
      .replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"')
      .replace(/[–—−]/g,'-').replace(/•/g,'-').replace(/…/g,'...')
      .replace(/≈/g,'~').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->')
      .replace(/ /g,' ').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g,'');
  }
  function weekData(aid){
    var a=S.athleten.find(function(x){return x.id===aid;});
    var vkw=S.viewKW||KWN, vyr=S.viewYR||YRN;
    var woche=(a&&a.wochen&&a.wochen[kwKeyStr(vkw,vyr)])||{};
    var ids=['plan','plan2','plan3'];
    var plans=ids.map(function(f){
      var ta=document.getElementById(f+'-'+aid);
      return ((ta?ta.value:woche[f])||'').trim();
    });
    return {a:a,vkw:vkw,vyr:vyr,plans:plans};
  }
  function hexRgb(h){h=String(h||'#888888').replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function fmtD(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}

  window.showPdfSend=function(aid){
    var w=weekData(aid);if(!w.a)return;
    loadJsPdf().catch(function(){});
    var chk=w.plans.map(function(p,i){
      var empty=!p;
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;'+(empty?'opacity:.4;':'cursor:pointer;')+'">'
        +'<input type="checkbox" id="pdf-t'+(i+1)+'" '+(empty?'disabled':'checked')+'> Training '+(i+1)+(empty?' <span style="font-size:11px;color:var(--muted);">(leer)</span>':'')+'</label>';
    }).join('');
    modal('<h3>'+w.a.name+' – Plan als PDF</h3>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">KW '+w.vkw+' / '+w.vyr+'</div>'
      +'<div class="frow"><label>Welche Trainings?</label>'+chk+'</div>'
      +'<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;"><input type="checkbox" id="pdf-rm" checked> Aktuelle 1RM-Werte mitsenden</label>'
      +'<div class="frow"><label>Bemerkung (optional)</label><textarea id="pdf-bem" rows="2" style="width:100%;" placeholder="z.B. Bitte Gewichte notieren"></textarea></div>'
      +'<div id="pdf-msg" style="font-size:12px;color:var(--muted);min-height:16px;"></div>'
      +'<div class="mbtns"><button onclick="closeM()">Abbrechen</button><button class="primary" id="pdf-go" onclick="pdfSendGo('+aid+')">PDF erstellen & senden</button></div>');
  };

  function buildPdf(aid,sel,withRM,bem){
    var w=weekData(aid),a=w.a;
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:'mm',format:'a4'});
    var W=210,H=297,M=15,y=M,red=[232,0,15];
    function need(h){if(y+h>H-20){doc.addPage();y=M;}}
    var e=getEntry(a.plan,w.vkw,w.vyr);
    var phase=e?e.phase:'Ungeplant',ins=e?e.int:0;
    // Logo
    var logoW=0;
    try{var pr=doc.getImageProperties(HT_LOGO);var lh=24;logoW=lh*pr.width/pr.height;doc.addImage(HT_LOGO,'JPEG',W-M-logoW,y,logoW,lh);}catch(err){}
    doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(17,17,17);
    doc.text(clean(a.name),M,y+6);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(136,136,136);
    doc.text(clean(a.sport||''),M,y+12);
    // Phase-Pill
    var p=pd(phase,ins),pt=clean(phase+' · '+ins+'%');
    doc.setFontSize(9);doc.setFont('helvetica','bold');
    var pw=doc.getTextWidth(pt)+8;
    doc.setFillColor.apply(doc,hexRgb(p.f));doc.roundedRect(M,y+15,pw,6,3,3,'F');
    doc.setTextColor.apply(doc,hexRgb(p.t));doc.text(pt,M+4,y+19.2);
    y+=26;
    // KW
    var monD=kwToDate(w.vkw,w.vyr),sunD=new Date(monD);sunD.setDate(monD.getDate()+6);
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(17,17,17);
    doc.text('KW '+w.vkw+' / '+w.vyr,M,y+3);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(232,0,15);
    doc.text(fmtD(monD)+' - '+fmtD(sunD),M+30,y+3);
    y+=6;
    doc.setDrawColor(232,0,15);doc.setLineWidth(0.8);doc.line(M,y,W-M,y);y+=6;
    // Trainings
    sel.forEach(function(i){
      var txt=w.plans[i];if(!txt)return;
      need(16);
      doc.setFillColor(232,0,15);doc.roundedRect(M,y,W-2*M,7,1.5,1.5,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
      doc.text('TRAINING '+(i+1),M+3,y+4.9);y+=9;
      doc.setFont('helvetica','normal');doc.setFontSize(10);
      txt.split('\n').forEach(function(line){
        var l=clean(line).replace(/\s+$/,'');
        if(!l.trim()){y+=2.5;return;}
        var url=vidBase(line).length<=100?videoForLine(line):null;
        var maxW=W-2*M-(url?20:4);
        var parts=doc.splitTextToSize(l,maxW);
        need(parts.length*4.6+1);
        doc.setTextColor(17,17,17);
        parts.forEach(function(pt2,k){doc.text(pt2,M+2,y+3.5+k*4.6);});
        if(url){
          doc.setTextColor(232,0,15);doc.setFont('helvetica','bold');doc.setFontSize(9);
          doc.textWithLink('> Video',W-M-15,y+3.5,{url:url});
          doc.setFont('helvetica','normal');doc.setFontSize(10);
        }
        y+=parts.length*4.6;
        doc.setDrawColor(221,221,221);doc.setLineWidth(0.2);doc.line(M,y+0.6,W-M,y+0.6);y+=1.6;
      });
      y+=5;
    });
    // 1RM
    if(withRM){
      var rows=(typeof MAIN_TESTS!=='undefined'?MAIN_TESTS:[]).map(function(k){var c=getCurrent(a,k.key);return c&&c.val!==null&&c.val!==undefined&&c.val!==''?{l:k.label,v:c.val+(k.unit?' '+k.unit:''),d:c.dat||''}:null;}).filter(Boolean);
      if(rows.length){
        need(10+rows.length*6);
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(153,153,153);
        doc.text('AKTUELLE TESTWERTE (1RM)',M,y+3);y+=5;
        doc.setFillColor(245,245,245);doc.rect(M,y,W-2*M,rows.length*6+2,'F');y+=1;
        rows.forEach(function(r){
          doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(102,102,102);doc.text(clean(r.l),M+3,y+4);
          doc.setFont('helvetica','bold');doc.setTextColor(17,17,17);doc.text(clean(String(r.v)),M+55,y+4);
          doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(150,150,150);doc.text(clean(r.d==='—'?'':r.d),M+90,y+4);
          y+=6;
        });
        y+=6;
      }
    }
    if(bem){
      var bl=doc.splitTextToSize(clean(bem),W-2*M);
      need(8+bl.length*4.6);
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(153,153,153);doc.text('BEMERKUNG',M,y+3);y+=5;
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(17,17,17);
      bl.forEach(function(t,k){doc.text(t,M,y+3.5+k*4.6);});y+=bl.length*4.6+4;
    }
    // Fusszeile auf jeder Seite
    var n=doc.getNumberOfPages();
    for(var pg=1;pg<=n;pg++){
      doc.setPage(pg);
      doc.setDrawColor(221,221,221);doc.setLineWidth(0.2);doc.line(M,H-16,W-M,H-16);
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(232,0,15);doc.text('Tommy Herzog',M,H-11);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,120,120);
      doc.text('Herzog Training GmbH · info@herzog-training.ch · herzog-training.ch',M,H-7);
      doc.text('Erstellt '+fmtD(new Date())+(n>1?'  ·  Seite '+pg+'/'+n:''),W-M,H-7,{align:'right'});
    }
    var fname=('Trainingsplan_'+a.name+'_KW'+w.vkw+'_'+w.vyr).replace(/[^A-Za-z0-9ÄÖÜäöüéèà_-]+/g,'_')+'.pdf';
    return {blob:doc.output('blob'),name:fname};
  }

  function download(res){
    var u=URL.createObjectURL(res.blob);var l=document.createElement('a');l.href=u;l.download=res.name;
    document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove();},4000);
  }

  window.pdfSendGo=function(aid){
    var msg=document.getElementById('pdf-msg');
    var sel=[0,1,2].filter(function(i){var c=document.getElementById('pdf-t'+(i+1));return c&&c.checked&&!c.disabled;});
    if(!sel.length){msg.textContent='Bitte mindestens ein Training anhaken.';return;}
    if(!(window.jspdf&&window.jspdf.jsPDF)){
      msg.textContent='PDF wird vorbereitet … bitte gleich nochmals tippen.';
      loadJsPdf().then(function(){msg.textContent='Bereit – bitte nochmals «PDF erstellen & senden» tippen.';}).catch(function(){msg.textContent='Keine Internetverbindung zum Laden des PDF-Moduls.';});
      return;
    }
    var withRM=document.getElementById('pdf-rm').checked;
    var bem=(document.getElementById('pdf-bem').value||'').trim();
    var res;
    try{res=buildPdf(aid,sel,withRM,bem);}catch(err){msg.textContent='Fehler beim Erstellen: '+err.message;return;}
    var file=null;
    try{file=new File([res.blob],res.name,{type:'application/pdf'});}catch(err){}
    var isMacDesktop=/Mac/.test(navigator.platform||navigator.userAgent)&&!(navigator.maxTouchPoints>1);
    if(isMacDesktop){
      download(res);
      msg.innerHTML='PDF gespeichert in «Downloads» ('+res.name+').<br>WhatsApp öffnen, Chat wählen und das PDF hineinziehen.'
        +'<div style="margin-top:8px;"><a href="whatsapp://" style="display:inline-block;background:#25D366;color:#fff;text-decoration:none;font-weight:600;padding:7px 14px;border-radius:7px;">WhatsApp öffnen</a></div>';
      return;
    }
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:res.name.replace(/\.pdf$/,'')}).then(function(){closeM();}).catch(function(err){
        if(err&&err.name==='AbortError')return;
        download(res);msg.textContent='Teilen nicht möglich – PDF wurde gespeichert.';
      });
    }else{
      download(res);msg.textContent='PDF wurde gespeichert (Downloads). Jetzt in WhatsApp hineinziehen.';
    }
  };
})();
</script>
<script>
/* Trainingspläne extern: Pläne für Kunden, die selbst trainieren. In der App abgelegt, als PDF mit Videolinks senden. */
(function(){
  var JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  var loading=null;
  function loadJsPdf(){
    if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve();
    if(loading)return loading;
    loading=new Promise(function(res,rej){
      var s=document.createElement('script');s.src=JSPDF_URL;s.onload=function(){res();};
      s.onerror=function(){loading=null;rej(new Error('jsPDF konnte nicht geladen werden'));};
      document.head.appendChild(s);
    });
    return loading;
  }
  function clean(t){
    return String(t==null?'':t)
      .replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"')
      .replace(/[–—−]/g,'-').replace(/•/g,'-').replace(/…/g,'...')
      .replace(/≈/g,'~').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->')
      .replace(/ /g,' ').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g,'');
  }
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtD(ts){var d=ts instanceof Date?ts:new Date(ts);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}
  function list(){if(!S.extern)S.extern=[];return S.extern;}
  function find(id){return list().find(function(p){return p.id===id;});}
  var openId=null,tmr=null;
  function saveSoon(){if(tmr)clearTimeout(tmr);tmr=setTimeout(function(){tmr=null;save();},1200);}
  function flush(){if(tmr){clearTimeout(tmr);tmr=null;save();}}

  var BTN='font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit;';
  var BTN_RED=BTN+'border:1px solid #E8000F;background:#E8000F;color:#fff;';
  var BTN_LIGHT=BTN+'border:1px solid var(--border);background:transparent;color:var(--text);';

  function fInput(p,f,label,ph){
    return '<div class="frow"><label>'+label+'</label><input value="'+esc(p[f]||'')+'" placeholder="'+esc(ph||'')+'" oninput="extSet('+p.id+',\''+f+'\',this.value)" style="width:100%;"></div>';
  }
  function fArea(p,f,label,rows,hint){
    return '<div class="frow"><label>'+label+'</label>'+(hint?'<div style="font-size:11px;color:var(--muted);margin-bottom:4px;">'+hint+'</div>':'')
      +'<textarea rows="'+rows+'" oninput="extSet('+p.id+',\''+f+'\',this.value)" style="width:100%;">'+esc(p[f]||'')+'</textarea></div>';
  }
  function card(p){
    var isOpen=openId===p.id;
    var sub=[p.kunde,p.sport,p.ts?fmtD(p.ts):''].filter(Boolean).join(' · ');
    var h='<div style="margin-bottom:12px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;">'
      +'<div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="extToggle('+p.id+')">'
      +'<div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:700;">'+esc(p.titel||'Ohne Titel')+'</div>'
      +'<div style="font-size:12px;color:var(--muted);">'+esc(sub)+'</div></div>'
      +'<button onclick="event.stopPropagation();extPdf('+p.id+')" style="'+BTN_RED+'">📄 PDF senden</button>'
      +'<span style="font-size:12px;color:var(--muted);width:14px;text-align:center;">'+(isOpen?'▲':'▼')+'</span></div>';
    if(isOpen){
      h+='<div style="margin-top:14px;">'
        +fInput(p,'titel','Titel','z.B. Athletiktraining Golf 6 Wochen')
        +'<div style="display:flex;gap:10px;flex-wrap:wrap;"><div style="flex:1;min-width:180px;">'+fInput(p,'kunde','Kunde / Kundin','Name')+'</div>'
        +'<div style="flex:1;min-width:180px;">'+fInput(p,'sport','Sportart','z.B. Golf')+'</div></div>'
        +fArea(p,'einleitung','Einleitung',4,'Steht oben im PDF in einem grauen Kasten.');
      h+='<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 4px;">Trainings</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Pro Zeile eine Übung: Name aus dem Übungskatalog, dann « / » und die Erklärung. Das Video wird dann automatisch verlinkt.</div>';
      (p.trainings||[]).forEach(function(t,i){
        var tid='ext-ta-'+p.id+'-'+i;
        h+='<div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;">'
          +'<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">'
          +'<input value="'+esc(t.titel||'')+'" placeholder="z.B. Training A" oninput="extTr('+p.id+','+i+',\'titel\',this.value)" style="flex:1;font-weight:700;">'
          +(i>0?'<button onclick="extTrMove('+p.id+','+i+',-1)" title="nach oben" style="'+BTN_LIGHT+'padding:4px 9px;">↑</button>':'')
          +'<button onclick="extTrDel('+p.id+','+i+')" title="Training entfernen" style="'+BTN_LIGHT+'padding:4px 9px;">✕</button></div>'
          +'<textarea id="'+tid+'" rows="9" style="width:100%;" oninput="extTr('+p.id+','+i+',\'text\',this.value);updatePlanVids(this.id)">'+esc(t.text||'')+'</textarea>'
          +'<div id="vids-'+tid+'">'+planVidsHtml(t.text||'')+'</div></div>';
      });
      h+='<button onclick="extTrAdd('+p.id+')" style="'+BTN_LIGHT+'margin-bottom:14px;">+ Training</button>'
        +fArea(p,'ablauf','Ablauf / Steigerung',7,'Tabelle: Spalten mit « | » trennen, erste Zeile = Überschrift. Normale Zeilen werden als Text gedruckt.')
        +fArea(p,'hinweis','Hinweis',2,'Steht unten im PDF, z.B. was bei Schmerzen zu tun ist.')
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">'
        +'<button onclick="extDup('+p.id+')" style="'+BTN_LIGHT+'">⧉ Duplizieren</button>'
        +'<button onclick="extDel('+p.id+')" style="'+BTN_LIGHT+'color:#E8000F;">Löschen</button>'
        +'</div></div>';
    }
    return h+'</div>';
  }
  window.rExtern=function(){
    var el=document.getElementById('view-extern');if(!el)return;
    var arr=list().slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    var h='<div style="padding:1rem 0;">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;flex-wrap:wrap;">'
      +'<h2 style="font-size:18px;font-weight:700;">📄 Trainingspläne extern</h2>'
      +'<button onclick="extNeu()" style="'+BTN_RED+'">+ Neuer Plan</button></div>'
      +'<p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Pläne für Kunden, die selbst trainieren. Als PDF mit Logo und anklickbaren Videos senden.</p>';
    if(!arr.length)h+='<div style="font-size:13px;color:var(--muted);">Noch keine Pläne.</div>';
    arr.forEach(function(p){h+=card(p);});
    el.innerHTML=h+'</div>';
  };
  window.extToggle=function(id){flush();openId=openId===id?null:id;rExtern();};
  window.extSet=function(id,f,v){var p=find(id);if(!p)return;p[f]=v;saveSoon();};
  window.extTr=function(id,i,f,v){var p=find(id);if(!p||!p.trainings[i])return;p.trainings[i][f]=v;saveSoon();};
  window.extNeu=function(){
    flush();var id=Date.now();
    list().push({id:id,ts:id,titel:'Neuer Plan',kunde:'',sport:'',einleitung:'',trainings:[{titel:'Training A',text:''}],ablauf:'',hinweis:''});
    openId=id;save();rExtern();
  };
  window.extTrAdd=function(id){
    var p=find(id);if(!p)return;if(!p.trainings)p.trainings=[];
    p.trainings.push({titel:'Training '+String.fromCharCode(65+p.trainings.length),text:''});save();rExtern();
  };
  window.extTrDel=function(id,i){
    var p=find(id);if(!p)return;
    if(!confirm('Training «'+(p.trainings[i].titel||'')+'» entfernen?'))return;
    p.trainings.splice(i,1);save();rExtern();
  };
  window.extTrMove=function(id,i,d){
    var p=find(id);if(!p)return;var j=i+d;if(j<0||j>=p.trainings.length)return;
    var t=p.trainings[i];p.trainings[i]=p.trainings[j];p.trainings[j]=t;save();rExtern();
  };
  window.extDup=function(id){
    flush();var p=find(id);if(!p)return;
    var c=JSON.parse(JSON.stringify(p));c.id=Date.now();c.ts=c.id;c.titel=(p.titel||'Plan')+' (Kopie)';c.kunde='';
    list().push(c);openId=c.id;save();rExtern();
  };
  window.extDel=function(id){
    var p=find(id);if(!p)return;
    if(!confirm('Plan «'+(p.titel||'')+'» löschen?'))return;
    S.extern=list().filter(function(x){return x.id!==id;});openId=null;save();rExtern();
  };

  function buildPdf(p){
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:'mm',format:'a4'});
    var W=210,H=297,M=15,y=M,LH=4.6;
    function need(h){if(y+h>H-20){doc.addPage();y=M;}}
    function wrap(t,w){var out=[];String(t).split('\n').forEach(function(par){var s=doc.splitTextToSize(par,w);if(!s.length)s=[''];out=out.concat(s);});return out;}
    function bar(txt){
      need(16);
      doc.setFillColor(232,0,15);doc.roundedRect(M,y,W-2*M,7,1.5,1.5,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
      doc.text(clean(txt).toUpperCase(),M+3,y+4.9);y+=10;
    }
    function box(txt,label){
      doc.setFont('helvetica','normal');doc.setFontSize(10);
      var ls=wrap(clean(txt),W-2*M-9);
      var hh=ls.length*LH+(label?9:5);
      need(hh);
      doc.setFillColor(245,245,245);doc.rect(M,y,W-2*M,hh,'F');
      doc.setFillColor(232,0,15);doc.rect(M,y,1.2,hh,'F');
      var yy=y+5;
      if(label){doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(232,0,15);doc.text(label,M+5,yy);yy+=5;doc.setFont('helvetica','normal');doc.setFontSize(10);}
      doc.setTextColor(17,17,17);
      ls.forEach(function(l,k){doc.text(l,M+5,yy+k*LH);});
      y+=hh+6;
    }
    // Kopf
    var logoW=0;
    try{var pr=doc.getImageProperties(HT_LOGO);var lh=24;logoW=lh*pr.width/pr.height;doc.addImage(HT_LOGO,'JPEG',W-M-logoW,y,logoW,lh);}catch(err){}
    doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(17,17,17);
    var tl=doc.splitTextToSize(clean(p.titel||'Trainingsplan'),W-2*M-logoW-6);
    tl.forEach(function(l,k){doc.text(l,M,y+6+k*7);});
    var yy=y+6+tl.length*7;
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(136,136,136);
    var sub=[p.kunde,p.sport].filter(Boolean).join(' · ');
    if(sub){doc.text(clean(sub),M,yy);yy+=5;}
    y=Math.max(y+27,yy+2);
    doc.setDrawColor(232,0,15);doc.setLineWidth(0.8);doc.line(M,y,W-M,y);y+=6;
    if((p.einleitung||'').trim())box(p.einleitung.trim(),'');
    // Trainings
    (p.trainings||[]).forEach(function(t){
      var txt=(t.text||'').trim();if(!txt)return;
      bar(t.titel||'Training');
      txt.split('\n').forEach(function(line){
        var raw=line.replace(/\s+$/,'');
        if(!raw.trim()){y+=2.5;return;}
        var url=vidBase(raw).length<=100?videoForLine(raw):null;
        var idx=raw.indexOf(' / ');
        var name=idx>0?raw.slice(0,idx).trim():null;
        var rest=idx>0?raw.slice(idx+3).trim():raw.trim();
        var maxW=W-2*M-(url?20:4);
        doc.setFontSize(10);
        doc.setFont('helvetica','bold');
        var nl=name?doc.splitTextToSize(clean(name),maxW):[];
        doc.setFont('helvetica','normal');
        var rl=rest?doc.splitTextToSize(clean(rest),name?W-2*M-4:maxW):[];
        var isHead=!name&&/:$/.test(raw.trim());
        need((nl.length+rl.length)*LH+2);
        var y0=y;
        doc.setTextColor(17,17,17);
        if(nl.length){doc.setFont('helvetica','bold');nl.forEach(function(l,k){doc.text(l,M+2,y+3.5+k*LH);});y+=nl.length*LH;}
        doc.setFont('helvetica',isHead?'bold':'normal');
        if(name)doc.setTextColor(70,70,70);
        rl.forEach(function(l,k){doc.text(l,M+2,y+3.5+k*LH);});
        y+=rl.length*LH;
        if(url){
          doc.setTextColor(232,0,15);doc.setFont('helvetica','bold');doc.setFontSize(9);
          doc.textWithLink('> Video',W-M-15,y0+3.5,{url:url});
          doc.setFontSize(10);
        }
        doc.setFont('helvetica','normal');
        doc.setDrawColor(221,221,221);doc.setLineWidth(0.2);doc.line(M,y+0.8,W-M,y+0.8);y+=2.2;
      });
      y+=5;
    });
    // Ablauf
    var ab=(p.ablauf||'').trim();
    if(ab){
      bar('Ablauf');
      var lines=ab.split('\n'),i=0;
      while(i<lines.length){
        var ln=lines[i];
        if(ln.indexOf('|')!==-1){
          var rows=[];
          while(i<lines.length&&lines[i].indexOf('|')!==-1){rows.push(lines[i].split('|').map(function(c){return clean(c.trim());}));i++;}
          var nc=Math.max.apply(null,rows.map(function(r){return r.length;}));
          var cw=(W-2*M)/nc;
          rows.forEach(function(r,ri){
            doc.setFont('helvetica',ri===0?'bold':'normal');doc.setFontSize(ri===0?9:9.5);
            var cells=[];for(var c=0;c<nc;c++)cells.push(doc.splitTextToSize(r[c]||'',cw-3));
            var rh=Math.max.apply(null,cells.map(function(x){return x.length;}))*4.2+3;
            need(rh);
            for(var c2=0;c2<nc;c2++){
              var x=M+c2*cw;
              if(ri===0){doc.setFillColor(242,242,242);doc.rect(x,y,cw,rh,'F');}
              doc.setDrawColor(200,200,200);doc.setLineWidth(0.2);doc.rect(x,y,cw,rh);
              doc.setTextColor(17,17,17);
              doc.setFont('helvetica',(ri===0||c2===0)?'bold':'normal');
              cells[c2].forEach(function(l,k){doc.text(l,x+1.5,y+4+k*4.2);});
            }
            y+=rh;
          });
          y+=4;
        }else{
          if(!ln.trim()){y+=2.5;i++;continue;}
          doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(17,17,17);
          var pl=doc.splitTextToSize(clean(ln.trim()),W-2*M-4);
          need(pl.length*LH+1);
          pl.forEach(function(l,k){doc.text(l,M+2,y+3.5+k*LH);});
          y+=pl.length*LH+1;i++;
        }
      }
      y+=4;
    }
    if((p.hinweis||'').trim())box(p.hinweis.trim(),'WICHTIG');
    // Fusszeile
    var n=doc.getNumberOfPages();
    for(var pg=1;pg<=n;pg++){
      doc.setPage(pg);
      doc.setDrawColor(221,221,221);doc.setLineWidth(0.2);doc.line(M,H-16,W-M,H-16);
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(232,0,15);doc.text('Tommy Herzog',M,H-11);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,120,120);
      doc.text('Herzog Training GmbH · info@herzog-training.ch · herzog-training.ch',M,H-7);
      doc.text('Erstellt '+fmtD(new Date())+(n>1?'  ·  Seite '+pg+'/'+n:''),W-M,H-7,{align:'right'});
    }
    var fname=('Trainingsplan_'+(p.titel||'')+(p.kunde?'_'+p.kunde:'')).replace(/[^A-Za-z0-9ÄÖÜäöüéèà_-]+/g,'_').replace(/_+/g,'_')+'.pdf';
    return {blob:doc.output('blob'),name:fname};
  }
  window.extBuildPdf=buildPdf;

  function download(res){
    var u=URL.createObjectURL(res.blob);var l=document.createElement('a');l.href=u;l.download=res.name;
    document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove();},4000);
  }
  window.extPdf=function(id){
    flush();var p=find(id);if(!p)return;
    loadJsPdf().catch(function(){});
    modal('<h3>'+esc(p.titel||'Plan')+' – PDF</h3>'
      +'<div style="font-size:13px;color:var(--muted);margin-bottom:8px;">'+esc([p.kunde,p.sport].filter(Boolean).join(' · ')||'Kein Kunde eingetragen')+'</div>'
      +'<div style="font-size:12px;color:var(--muted);">Das PDF enthält Logo, alle Trainings mit anklickbaren Videos, den Ablauf und den Hinweis.</div>'
      +'<div id="extpdf-msg" style="font-size:12px;color:var(--muted);min-height:16px;margin-top:8px;"></div>'
      +'<div class="mbtns"><button onclick="closeM()">Abbrechen</button><button class="primary" onclick="extPdfGo('+id+')">PDF erstellen & senden</button></div>');
  };
  window.extPdfGo=function(id){
    var msg=document.getElementById('extpdf-msg');var p=find(id);if(!p)return;
    if(!(window.jspdf&&window.jspdf.jsPDF)){
      msg.textContent='PDF wird vorbereitet … bitte gleich nochmals tippen.';
      loadJsPdf().then(function(){msg.textContent='Bereit – bitte nochmals «PDF erstellen & senden» tippen.';}).catch(function(){msg.textContent='Keine Internetverbindung zum Laden des PDF-Moduls.';});
      return;
    }
    var res;
    try{res=buildPdf(p);}catch(err){msg.textContent='Fehler beim Erstellen: '+err.message;return;}
    var file=null;
    try{file=new File([res.blob],res.name,{type:'application/pdf'});}catch(err){}
    var isMacDesktop=/Mac/.test(navigator.platform||navigator.userAgent)&&!(navigator.maxTouchPoints>1);
    if(isMacDesktop){
      download(res);
      msg.innerHTML='PDF gespeichert in «Downloads» ('+esc(res.name)+').<br>WhatsApp öffnen, Chat wählen und das PDF hineinziehen.'
        +'<div style="margin-top:8px;"><a href="whatsapp://" style="display:inline-block;background:#25D366;color:#fff;text-decoration:none;font-weight:600;padding:7px 14px;border-radius:7px;">WhatsApp öffnen</a></div>';
      return;
    }
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:res.name.replace(/\.pdf$/,'')}).then(function(){closeM();}).catch(function(err){
        if(err&&err.name==='AbortError')return;
        download(res);msg.textContent='Teilen nicht möglich – PDF wurde gespeichert.';
      });
    }else{
      download(res);msg.textContent='PDF wurde gespeichert (Downloads). Jetzt in WhatsApp hineinziehen.';
    }
  };
})();
</script>
</body>
</html>
